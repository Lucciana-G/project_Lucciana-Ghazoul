                <legend>Kontakt formulär:</legend>
                <label for="fullname">Namn:</label><br>
                <input type="text" id="fullname">
                <br>
                <label for="email">E-post:</label><br>
                <input type="email" id="email">&nbsp;
                <br>
                <label for="phone">Telefon:</label><br>
                <input type="tel" id="phone">&nbsp;
                <br>
                <label for="text">Beskriv ditt ärende:</label><br>
                <textarea id="textarea" name="message" rows="5" cols="40" placeholder="Skriv vad gäller ditt ärende.."></textarea>&nbsp;
               </fieldset>
               <br>
               <button type="submit" id="skicka-uppdrag">Skicka ärende</button>&nbsp;
            </form>
          </section>

          <section>
            <div id="history"></div>
          </section>
        </div>
