<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chicle&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/kontakt.css">
    <script src="js/kontakt.js" defer></script>
    <title>Kontakt</title>
</head>
<body>
     <header class="site-header">
        <div class="logo-box">
            <img src="images/logo-transparent.svg" alt="Logo-vit" class="logo-1" width="300" height="100">
        </div>

        <button class="menu-troggle">☰</button>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Hem</a></li>
                <li><a href="sortiment.html">Sortiment</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
                <li><a href="konditori.html">Konditori</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contain">
          <section id="new">
            <ul id="errorlist"></ul>

            <form id="kundForm">
                <fieldset>
                <legend>Kontakt formulär:</legend>
                <label for="fullname">Namn:</label><br>
                <input type="text" id="fullname">
                <br>
                <label for="email">E-post:</label><br>
                <input type="email" id="email">&nbsp;
                <br>
                <label for="phone">Telefon:</label><br>
                <input type="tel" id="phone">&nbsp;
                <br>
                <label for="text">Beskriv ditt ärende:</label><br>
                <textarea id="message" name="message" rows="5" cols="40" placeholder="Skriv vad gäller ditt ärende.."></textarea>&nbsp;
               </fieldset>
               <br>
               <button type="submit" id="skicka-uppdrag">Skicka ärende</button>&nbsp;
            </form>
          </section>

          <section>
            <h3>Ditt ärende skickades✅</h3>
            <div id="history"></div>
          </section>
        </div>
    </main>
</body>
</html>
